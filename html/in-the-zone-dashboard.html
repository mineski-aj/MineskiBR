<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="js/cache-bust.js"></script>
<title>In The Zone</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0d0d12; color: #d0d0d8;
    display: flex; flex-direction: column; padding: 20px 24px; gap: 16px; overflow-y: auto;
  }
  .page-header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding-bottom: 14px; border-bottom: 1px solid #222232; flex-shrink: 0; flex-wrap: wrap;
  }
  .page-title { font-size: 14px; font-weight: 700; color: #fff; letter-spacing: 0.08em; text-transform: uppercase; }
  .status { font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #444; min-width: 90px; text-align: right; }
  .status.saving { color: #5577cc; } .status.saved { color: #00cc88; } .status.error { color: #ff4455; }

  .panel { background: #13131c; border: 1px solid #1e1e2c; border-radius: 10px; padding: 16px; }
  .panel-title { font-size: 11px; font-weight: 700; color: #777; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; }

  .threshold { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .threshold label { font-size: 13px; font-weight: 600; color: #ccc; }
  .threshold input {
    width: 140px; background: rgba(255,255,255,0.04); border: 1px solid #252535; border-radius: 6px;
    color: #fff; padding: 8px 12px; font-family: inherit; font-size: 18px; font-weight: 700; outline: none;
  }
  .threshold input:focus { border-color: #ffe800; }
  .hint { font-size: 11px; color: #555; line-height: 1.5; }

  .teams { display: flex; flex-direction: column; gap: 6px; }
  .team {
    display: grid; grid-template-columns: 28px 36px 1fr 60px 80px 120px; align-items: center; gap: 12px;
    padding: 8px 12px; border: 1px solid #1e1e2c; border-radius: 8px; background: #0f0f16; cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  .team:hover { background: #151520; }
  .team.on { background: #2a2608; border-color: #ffe800; }
  .team input[type=checkbox] { width: 20px; height: 20px; accent-color: #ffe800; cursor: pointer; }
  .team .logo { width: 32px; height: 32px; object-fit: contain; background: #000; border-radius: 4px; }
  .team .name { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: 0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .team .region { font-size: 12px; font-weight: 700; color: #777; }
  .team .score { font-size: 15px; font-weight: 800; color: #aaa; text-align: right; font-variant-numeric: tabular-nums; }
  .team .chip { font-size: 10px; font-weight: 800; letter-spacing: 0.1em; color: #0d0d12; background: #ffe800; padding: 3px 8px; border-radius: 4px; text-align: center; visibility: hidden; }
  .team.on .chip { visibility: visible; }
  .empty { color: #666; font-size: 13px; padding: 12px 0; }
  .cols { display: grid; grid-template-columns: 28px 36px 1fr 60px 80px 120px; gap: 12px; padding: 0 12px 6px; font-size: 10px; font-weight: 700; color: #555; letter-spacing: 0.1em; text-transform: uppercase; }
  .cols span:nth-child(5) { text-align: right; }
</style>
</head>
<body>

<div class="page-header">
  <span class="page-title">In The Zone · Grand Finals</span>
  <span id="status" class="status">—</span>
</div>

<div class="panel">
  <div class="panel-title">Score threshold</div>
  <div class="threshold">
    <label for="threshold">Score a team needs to reach the zone</label>
    <input type="number" id="threshold" min="0" step="any" placeholder="—" inputmode="decimal">
  </div>
  <div class="hint" style="margin-top:10px;">Saved only for now — nothing uses this number yet.</div>
</div>

<div class="panel">
  <div class="panel-title">Teams · tick the ones who are In The Zone</div>
  <div class="cols"><span></span><span></span><span>Team</span><span>Region</span><span>Total</span><span></span></div>
  <div class="teams" id="teams"><div class="empty">Loading the Grand Finals sheet…</div></div>
</div>

<script>
  var zone = {};          /* squad name -> true while ticked */
  var saveTimer = null;

  function el(id) { return document.getElementById(id); }
  function setStatus(s) {
    var e = el('status'); e.className = 'status ' + s;
    e.textContent = s === 'saving' ? 'Saving…' : s === 'saved' ? 'Saved' : s === 'error' ? 'NOT SAVED — server rejected it (is the server restarted?)' : '';
    e.style.minWidth = s === 'error' ? '0' : '';
  }

  function payload() {
    var v = el('threshold').value.trim();
    return { zone: Object.keys(zone).filter(function (n) { return zone[n]; }), threshold: v === '' ? null : Number(v) };
  }
  /* Autosave: any change (tick or threshold) saves the whole state shortly after. */
  function queueSave() {
    setStatus('saving');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      fetch('/api/in-the-zone', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload()) })
        .then(function (r) { if (!r.ok) throw new Error(); setStatus('saved'); setTimeout(function () { setStatus(''); }, 1500); })
        .catch(function () { setStatus('error'); });
    }, 350);
  }

  function fmt(n) { return Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100); }

  function buildRows(teams) {
    var box = el('teams'); box.innerHTML = '';
    if (!teams.length) { box.innerHTML = '<div class="empty">No teams found on the Grand Finals tally sheet.</div>'; return; }
    teams.forEach(function (t) {
      var row = document.createElement('label');
      row.className = 'team' + (zone[t.name] ? ' on' : '');
      row.dataset.name = t.name;
      var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!zone[t.name];
      var logo = document.createElement('img'); logo.className = 'logo'; logo.alt = '';
      logo.src = '/logos/' + encodeURIComponent(t.name) + '.png'; logo.onerror = function () { logo.style.visibility = 'hidden'; };
      var name = document.createElement('span'); name.className = 'name'; name.textContent = t.name;
      var region = document.createElement('span'); region.className = 'region'; region.textContent = t.region || '';
      var score = document.createElement('span'); score.className = 'score'; score.textContent = fmt(t.totalScore || 0);
      var chip = document.createElement('span'); chip.className = 'chip'; chip.textContent = 'IN THE ZONE';
      [cb, logo, name, region, score, chip].forEach(function (c) { row.appendChild(c); });
      cb.addEventListener('change', function () {
        zone[t.name] = cb.checked; row.classList.toggle('on', cb.checked); queueSave();
      });
      box.appendChild(row);
    });
  }

  /* Scores move as the finals play out — refresh just those cells, never rebuild the rows mid-click. */
  function updateScores(teams) {
    teams.forEach(function (t) {
      var row = el('teams').querySelector('.team[data-name="' + (window.CSS && CSS.escape ? CSS.escape(t.name) : t.name) + '"]');
      if (row) row.querySelector('.score').textContent = fmt(t.totalScore || 0);
    });
  }

  function load(first) {
    return fetch('/api/in-the-zone', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
      if (first) {
        zone = {}; d.zone.forEach(function (n) { zone[n] = true; });
        if (document.activeElement !== el('threshold')) el('threshold').value = d.threshold === null ? '' : d.threshold;
        buildRows(d.teams);
      } else {
        updateScores(d.teams);
      }
    }).catch(function () { if (first) el('teams').innerHTML = '<div class="empty">Could not load the Grand Finals sheet.</div>'; });
  }

  el('threshold').addEventListener('input', queueSave);
  load(true);
  setInterval(function () { load(false); }, 5000);
</script>
</body>
</html>
