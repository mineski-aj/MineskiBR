<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="js/cache-bust.js"></script>
<title>Dynamic Content</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0d0d12;
    color: #d0d0d8;
    display: flex;
    flex-direction: column;
    padding: 20px 24px;
    gap: 16px;
    overflow-y: auto;
  }

  /* ── Header ── */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 14px;
    border-bottom: 1px solid #222232;
    flex-shrink: 0;
  }
  .page-title {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  /* ── Per-panel save controls ── */
  .panel-save-status {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #333;
    transition: color 0.3s;
  }
  .panel-save-status.saving { color: #5577cc; }
  .panel-save-status.saved  { color: #00cc88; }
  .panel-save-status.error  { color: #ff4455; }
  .panel-save-status.dirty  { color: #ddaa33; }

  .panel-save-btn {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #ddd;
    background: #2a2a3e;
    border: 1px solid #3a3a52;
    border-radius: 5px;
    padding: 4px 10px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .panel-save-btn:hover { background: #34344a; }
  .panel-save-btn:disabled { opacity: 0.4; cursor: default; }

  /* ── Panel row (PH only — EN/Universal removed) ── */
  .split-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    flex-shrink: 0;
  }

  /* ── Panel card ── */
  .panel {
    background: #13131c;
    border: 1px solid #1e1e2c;
    border-radius: 10px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .panel-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 10px;
    border-bottom: 1px solid #1a1a28;
  }
  .panel-badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 4px;
  }
  .badge-ph { background: #1a2a4a; color: #4a8fff; border: 1px solid #2a3a6a; }
  .panel-label-sub {
    font-size: 11px;
    color: #444;
    letter-spacing: 0.04em;
  }

  /* ── Field group ── */
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .field-label {
    font-size: 10px;
    font-weight: 700;
    color: #555;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  textarea {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid #252535;
    border-radius: 6px;
    color: #ddd;
    padding: 8px 10px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    outline: none;
    resize: vertical;
    min-height: 56px;
    transition: border-color 0.15s, background 0.15s;
  }
  textarea:focus {
    border-color: #4455aa;
    background: rgba(255,255,255,0.07);
  }
  textarea::placeholder { color: #333; }

  /* ── Map MVP picker ── */
  .badge-mvp { background: #3a3410; color: #ffe800; border: 1px solid #5a4f10; }
  select {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid #252535;
    border-radius: 6px;
    color: #ddd;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
  }
  select:focus { border-color: #4455aa; }
  select option, select optgroup { background: #13131c; color: #ddd; }
  .mvp-row { display: flex; align-items: center; gap: 8px; }
  .mvp-current { font-size: 12px; color: #888; }
  .mvp-current b { color: #ffe800; font-weight: 700; }
</style>
</head>
<body>

<div class="page-header">
  <span class="page-title">Dynamic Content</span>
</div>

<!-- PH only — EN and Universal panels removed by request -->
<div class="split-row">

  <!-- PH Panel -->
  <div class="panel">
    <div class="panel-header">
      <span class="panel-badge badge-ph">PH</span>
      <button id="ph-save-btn" class="panel-save-btn" onclick="savePanel('ph')">Save</button>
      <span id="ph-status" class="panel-save-status">—</span>
      <span class="panel-label-sub">Filipino Content</span>
    </div>
    <div class="field">
      <label class="field-label" for="ph-ticker">Ticker</label>
      <textarea id="ph-ticker" name="ph_ticker" rows="2" placeholder="Enter PH ticker text…"></textarea>
    </div>
    <div class="field">
      <label class="field-label" for="ph-headline">Headline</label>
      <textarea id="ph-headline" name="ph_headline" rows="2" placeholder="Enter PH headline…"></textarea>
    </div>
  </div>

  <!-- Map MVP Panel — who the Map MVP scene (Fullscreen) features -->
  <div class="panel">
    <div class="panel-header">
      <span class="panel-badge badge-mvp">MAP MVP</span>
      <button id="mvp-apply-btn" class="panel-save-btn" onclick="applyMvp()">Apply</button>
      <button class="panel-save-btn" onclick="clearMvp()">Clear</button>
      <span id="mvp-status" class="panel-save-status">—</span>
      <span class="panel-label-sub" id="mvp-map-label">Loading map…</span>
    </div>
    <div class="field">
      <label class="field-label" for="mvp-select">Player (current map, from the tally sheet)</label>
      <select id="mvp-select"></select>
    </div>
    <div class="mvp-current" id="mvp-current">—</div>
  </div>

</div>

<script>
  const FIELDS = ['ph_ticker', 'ph_headline'];
  const ID_MAP  = {
    ph_ticker:   'ph-ticker',
    ph_headline: 'ph-headline',
  };
  const PANELS = {
    ph: { fields: ['ph_ticker', 'ph_headline'], statusId: 'ph-status', btnId: 'ph-save-btn' },
  };

  // Last-known-saved value per field. A panel's own save only ever overwrites
  // ITS fields with live DOM values — every other field is re-sent from this
  // snapshot (matters once there's more than one panel again).
  const committed = {};

  function setStatus(panelKey, s) {
    const el = document.getElementById(PANELS[panelKey].statusId);
    el.className = 'panel-save-status ' + s;
    el.textContent = s === 'saving' ? 'Saving…' : s === 'saved' ? 'Saved' : s === 'error' ? 'Error' : s === 'dirty' ? 'Unsaved changes' : '—';
  }

  async function load() {
    try {
      const r = await fetch('/api/dynamic-content', { cache: 'no-store' });
      const d = await r.json();
      FIELDS.forEach(k => {
        committed[k] = d[k] || '';
        const el = document.getElementById(ID_MAP[k]);
        if (el) el.value = committed[k];
      });
    } catch {}
  }

  async function savePanel(panelKey) {
    const panel = PANELS[panelKey];
    const btnEl = document.getElementById(panel.btnId);
    setStatus(panelKey, 'saving');
    btnEl.disabled = true;
    const body = { ...committed };
    panel.fields.forEach(k => {
      const el = document.getElementById(ID_MAP[k]);
      body[k] = el ? el.value : '';
    });
    try {
      const r = await fetch('/api/dynamic-content', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (r.ok) {
        panel.fields.forEach(k => { committed[k] = body[k]; });
        setStatus(panelKey, 'saved');
        setTimeout(() => setStatus(panelKey, ''), 2000);
      } else {
        setStatus(panelKey, 'error');
      }
    } catch {
      setStatus(panelKey, 'error');
    } finally {
      btnEl.disabled = false;
    }
  }

  Object.entries(PANELS).forEach(([panelKey, panel]) => {
    panel.fields.forEach(k => {
      const el = document.getElementById(ID_MAP[k]);
      if (el) el.addEventListener('input', () => setStatus(panelKey, 'dirty'));
    });
  });

  load();

  /* ── Map MVP picker ──
     Players come from /api/map-mvp-players (live tally sheet, current map),
     the saved pick from /api/map-mvp-selection. The list refreshes every
     5s so kills stay current, but never clobbers a choice you've made in
     the dropdown and not applied yet. */
  const mvpSel = document.getElementById('mvp-select');
  let mvpSaved = { team: '', player: '' }; /* what the server has */
  let mvpTouched = false;                  /* dropdown changed, not applied */
  const mvpKey = (team, player) => JSON.stringify([team, player]);

  function setMvpStatus(s) {
    const el = document.getElementById('mvp-status');
    el.className = 'panel-save-status ' + s;
    el.textContent = s === 'saving' ? 'Saving…' : s === 'saved' ? 'Saved' : s === 'error' ? 'Error' : s === 'dirty' ? 'Not applied' : '—';
  }

  function renderMvpList(live) {
    const teams = (live && live.teams) || [];
    document.getElementById('mvp-map-label').textContent =
      live && live.sheet ? (live.sheet + (live.map ? ' · Map ' + live.map : '')) : 'No live tally sheet';
    const keep = mvpTouched ? mvpSel.value : mvpKey(mvpSaved.team, mvpSaved.player);
    mvpSel.innerHTML = '';
    const none = document.createElement('option');
    none.value = ''; none.textContent = '— Select a player —';
    mvpSel.appendChild(none);
    let found = false;
    teams.forEach(t => {
      const g = document.createElement('optgroup');
      g.label = t.name + ' — ' + t.kills + ' kills';
      t.players.forEach(p => {
        const o = document.createElement('option');
        o.value = mvpKey(t.name, p.name);
        o.textContent = p.name + ' (' + p.kills + ')';
        if (o.value === keep) found = true;
        g.appendChild(o);
      });
      mvpSel.appendChild(g);
    });
    mvpSel.value = found ? keep : '';
    /* the saved pick may not be on this sheet/map any more */
    const cur = document.getElementById('mvp-current');
    if (!mvpSaved.player) cur.textContent = 'No player picked — the scene shows only its header.';
    else {
      const t = teams.find(x => x.name === mvpSaved.team);
      const p = t && t.players.find(x => x.name === mvpSaved.player);
      cur.innerHTML = p
        ? 'On air: <b>' + esc(p.name) + '</b> (' + esc(t.name) + ') — ' + p.kills + ' elims, '
            + (t.kills > 0 ? Math.round(p.kills / t.kills * 100) : 0) + '% kill participation'
        : 'Saved pick <b>' + esc(mvpSaved.player) + '</b> (' + esc(mvpSaved.team) + ') is not on the current map — scene shows only its header.';
    }
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  async function refreshMvp() {
    try {
      const [live, sel] = await Promise.all([
        fetch('/api/map-mvp-players', { cache: 'no-store' }).then(r => r.json()),
        fetch('/api/map-mvp-selection', { cache: 'no-store' }).then(r => r.json()),
      ]);
      mvpSaved = { team: sel.team || '', player: sel.player || '' };
      renderMvpList(live);
    } catch (e) {
      document.getElementById('mvp-map-label').textContent = 'Could not load players';
    }
  }

  async function saveMvp(team, player) {
    setMvpStatus('saving');
    try {
      const r = await fetch('/api/map-mvp-selection', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ team, player }),
      });
      if (!r.ok) throw new Error();
      mvpTouched = false;
      setMvpStatus('saved');
      setTimeout(() => setMvpStatus(''), 2000);
      await refreshMvp();
    } catch (e) { setMvpStatus('error'); }
  }
  function applyMvp() {
    if (!mvpSel.value) return clearMvp();
    const [team, player] = JSON.parse(mvpSel.value);
    saveMvp(team, player);
  }
  function clearMvp() { mvpTouched = false; saveMvp('', ''); }

  mvpSel.addEventListener('change', () => { mvpTouched = true; setMvpStatus('dirty'); });
  refreshMvp();
  setInterval(refreshMvp, 5000);
</script>
</body>
</html>
